name: Checkpoint 02 verification
on:
  push:
    branches: [checkpoint-02-quality-gost]
    paths: ['.github/workflows/checkpoint02-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download interface runtime dependencies
        run: |
          mkdir -p verification/wheels
          python -m pip download --no-deps --only-binary=:all: -d verification/wheels pyarrow==21.0.0 watchdog==6.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint02-ui-runtime
          path: verification/
          retention-days: 1
