name: Checkpoint 02 verification
on:
  push:
    branches: [main, checkpoint-02-quality-gost]
    paths: ['checkpoint_02/**', '.github/workflows/checkpoint02-verify.yml']
  pull_request:
    paths: ['checkpoint_02/**', '.github/workflows/checkpoint02-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: checkpoint_02/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r checkpoint_02/requirements.txt
      - name: Download and verify the pinned corpus
        run: python -c 'from checkpoint_02.corpus import ensure_pdfs; ensure_pdfs()'
      - name: Execute all notebook cells
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path('checkpoint_02/EDA.ipynb')
          nb = nbformat.read(path, as_version=4)
          NotebookClient(nb, timeout=240, kernel_name='python3', resources={'metadata': {'path': str(Path.cwd())}}).execute()
          nbformat.write(nb, path)
          PY
      - name: Test modules and Streamlit interactions
        run: python -m pytest checkpoint_02/tests -q --junitxml=checkpoint_02/results/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint02-verification
          path: |
            checkpoint_02/EDA.ipynb
            checkpoint_02/results/
            checkpoint_02/report.md
          retention-days: 7
