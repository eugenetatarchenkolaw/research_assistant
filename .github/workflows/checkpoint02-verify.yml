name: Checkpoint 02 verification
on:
  push:
    branches: [checkpoint-02-quality-gost]
    paths: ['.github/workflows/checkpoint02-verify.yml', '_checkpoint02_payload.*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint-02-quality-gost
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore locally tested source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          parts = sorted(Path('.').glob('_checkpoint02_payload.*'))
          if parts:
              raw = base64.b64decode(''.join(p.read_text() for p in parts))
              assert hashlib.sha256(raw).hexdigest() == '3ff1e1cbdd32c9f6be3f55b4679e126d1f56a67bc2cab6f0e065ed43d5c6454a', 'Payload checksum mismatch'
              for name, text in json.loads(lzma.decompress(raw)).items():
                  path = Path(name)
                  assert name.startswith('checkpoint_02/') and '..' not in path.parts
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint02-verification-inputs
          run-id: 42889615749
          github-token: ${{ github.token }}
          path: /tmp/checkpoint02-inputs
      - name: Restore checksum-pinned input PDFs
        run: |
          mkdir -p checkpoint_02/data/raw
          cp /tmp/checkpoint02-inputs/raw/*.pdf checkpoint_02/data/raw/
      - name: Install pinned dependencies
        run: python -m pip install -q -r checkpoint_02/requirements.txt
      - name: Execute notebook and regenerate report
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path('checkpoint_02/EDA.ipynb')
          nb = nbformat.read(path, as_version=4)
          NotebookClient(nb, timeout=240, kernel_name='python3', resources={'metadata': {'path': str(Path.cwd())}}).execute()
          nbformat.write(nb, path)
          assert all(c.execution_count is not None for c in nb.cells if c.cell_type == 'code' and c.source.strip())
          PY
      - name: Run unit and Streamlit interaction tests
        run: python -m pytest checkpoint_02/tests -q --junitxml=/tmp/checkpoint02-tests.xml
      - name: Save verification and publish checked files
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, platform, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('/tmp/checkpoint02-tests.xml').getroot()
          suites = list(root.iter('testsuite'))
          data = {'python': platform.python_version(), 'tests': sum(int(s.attrib.get('tests', 0)) for s in suites), 'failures': sum(int(s.attrib.get('failures', 0)) for s in suites), 'errors': sum(int(s.attrib.get('errors', 0)) for s in suites), 'notebook': 'executed top-to-bottom in fresh GitHub Actions Python 3.13', 'streamlit': 'AppTest interactions passed', 'colab_service': 'not tested in Google Colab itself', 'question_api': 'mocked tests only; no paid API call', 'human_review': False, 'run_url': os.environ['RUN_URL']}
          Path('checkpoint_02/results/validation.json').write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkpoint_02
          git rm --ignore-unmatch _checkpoint02_payload.*
          git diff --cached --quiet || git commit -m 'Add verified checkpoint 02: GOST corpus EDA, BM25, Streamlit and report'
          git push origin HEAD:checkpoint-02-quality-gost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint02-delivery
          path: |
            checkpoint_02/
            !checkpoint_02/data/raw/
            !checkpoint_02/data/cache/
            !checkpoint_02/**/__pycache__/
          retention-days: 7
